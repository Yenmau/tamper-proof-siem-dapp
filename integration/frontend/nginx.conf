server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # config.json jangan di-cache: alamat kontrak/RPC diisi saat container start
  location = /config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # folder batch server korban + artefak bukti Merkle (mount read-only)
  location /data/ {
    alias /data/;
    autoindex off;
    add_header Cache-Control "no-store";
    types { }
    default_type text/plain;
  }

  # React SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
