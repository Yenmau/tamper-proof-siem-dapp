# Override HANYA untuk dashboard: mengarahkan halaman SOC (http://127.0.0.1:8088)
# ke kontrak v4.0 di Sepolia, sementara service lain (chain lokal, collector, mongo,
# API) tetap berjalan seperti biasa di chain lokal.
#
# Pakai:
#   docker compose -f docker-compose.yml -f docker-compose.sepolia.yml --profile local up -d --no-deps dashboard
#
# Kembali ke mode chain lokal (tanpa file ini):
#   docker compose --profile local up -d --no-deps dashboard
services:
  dashboard:
    environment:
      RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
      CONTRACT_ADDRESS: 0x08129667d39d7e380Ac08d1359FeB5AD85b796e9
      API_BASE_URL: http://127.0.0.1:8089
      CHAIN_ID: "11155111"
      NETWORK_NAME: Sepolia testnet
      POLL_SECONDS: "8"
