[supervisord]
nodaemon=true
user=root

[program:rsyslogd]
command=/usr/sbin/rsyslogd -n
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# '-D' = foreground (wajib di container). JANGAN tambah '-e': flag itu membuat
# sshd menulis log ke stderr, sehingga baris "Failed password"/"Invalid user"
# tidak pernah masuk /var/log/auth.log dan tidak ikut ter-batch.
[program:sshd]
command=/usr/sbin/sshd -D
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:log-shipper]
command=node /opt/shipper/shipper.js
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
