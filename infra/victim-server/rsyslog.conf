# rsyslog minimal untuk container (tanpa systemd / imklog)
module(load="imuxsock")
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$WorkDirectory /var/spool/rsyslog

# Log autentikasi (SSH login/brute force) -> /var/log/auth.log
auth,authpriv.*     /var/log/auth.log
# Sisanya -> syslog
*.*;auth,authpriv.none  /var/log/syslog
